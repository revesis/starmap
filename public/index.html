<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Starmap</title>
<style>
  :root {
    --accent: #6df0ff;
    --accent-dim: rgba(109, 240, 255, 0.35);
    --hud-bg: linear-gradient(180deg, rgba(7, 14, 22, 0.55), rgba(6, 11, 18, 0.35));
  }
  html, body { margin: 0; padding: 0; height: 100%; background: #05060d; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #d6f5ff;
    overscroll-behavior: none; }
  #cosmos { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #cosmos.dragging { cursor: grabbing; }

  /* ---- 移动端引导：建议横屏 + 进入全屏 ---- */
  #mobileGate { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(5,6,13,0.92); backdrop-filter: blur(4px); }
  #mobileGate.show { display: flex; }
  .gate-card { position: relative; max-width: 300px; text-align: center; padding: 22px 24px;
    background: var(--hud-bg); border: 1px solid var(--accent-dim);
    clip-path: polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
    box-shadow: 0 0 30px rgba(109,240,255,0.1); }
  .gate-title { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
    text-shadow: 0 0 8px rgba(109,240,255,0.5); margin: 0 0 8px; }
  .gate-sub { font-size: 11.5px; color: #8fb8c2; line-height: 1.6; margin: 0 0 18px; }
  .gate-card button { display: block; width: 100%; box-sizing: border-box; padding: 10px;
    background: rgba(109,240,255,0.06); border: 1px solid var(--accent-dim); color: #d6f5ff;
    font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .gate-card button + button { margin-top: 8px; background: none; border-color: transparent; color: #6f97a0; font-size: 11px; }
  #gateEnter:hover { border-color: var(--accent); color: var(--accent); }

  /* 全屏扫描线 + 暗角，纯装饰，不挡交互 */
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 3; mix-blend-mode: screen;
    background:
      repeating-linear-gradient(0deg, rgba(140,220,255,0.025) 0px, rgba(140,220,255,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---- HUD 通用面板：切角、半透明、发光细边 ---- */
  .hud-panel {
    position: relative;
    background: var(--hud-bg);
    border: 1px solid var(--accent-dim);
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding: 10px 14px 12px;
    backdrop-filter: blur(3px);
    box-shadow: 0 0 18px rgba(109,240,255,0.05), inset 0 0 30px rgba(109,240,255,0.03);
    opacity: 0.62;
    transition: opacity .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .hud-panel:hover { opacity: 1; border-color: rgba(109,240,255,0.7); box-shadow: 0 0 22px rgba(109,240,255,0.15); }
  .hud-panel::before {
    content: ''; position: absolute; top: 0; left: 14px; width: 34px; height: 1px;
    background: var(--accent); box-shadow: 0 0 6px var(--accent); opacity: 0.8;
  }

  #hud { position: fixed; top: 14px; left: 14px; z-index: 5; display: flex; flex-direction: column; gap: 10px; max-width: 300px;
    transition: opacity .4s ease; }
  #hud.idle:not(:hover) { opacity: 0.16; }

  .title { font-size: 11px; font-weight: 600; letter-spacing: 2px; margin: 0 0 6px; color: var(--accent);
    text-transform: uppercase; text-shadow: 0 0 8px rgba(109,240,255,0.5); }
  .sub { font-size: 11px; color: #7fa3ad; margin: 0; letter-spacing: 0.3px; }

  #search { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 6px 8px; border: none;
    border-bottom: 1px solid var(--accent-dim); background: rgba(109,240,255,0.05); color: #d6f5ff; font-size: 12px;
    font-family: inherit; outline: none; }
  #search:focus { border-color: var(--accent); background: rgba(109,240,255,0.09); }
  #search::placeholder { color: #4d6b73; }

  #legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #8fb8c2; letter-spacing: 0.2px; }
  .dot { width: 7px; height: 7px; display: inline-block; box-shadow: 0 0 5px currentColor; }
  #stats { font-size: 10.5px; color: #547079; margin-top: 6px; line-height: 1.6; letter-spacing: 0.3px; }

  #soundToggle, #handToggle { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 6px 8px;
    background: rgba(109,240,255,0.05); border: 1px solid var(--accent-dim); color: #8fb8c2;
    font-family: inherit; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .2s ease; }
  #soundToggle:hover, #handToggle:hover { border-color: var(--accent); color: var(--accent); background: rgba(109,240,255,0.09); }
  #soundToggle.on, #handToggle.on { color: var(--accent); border-color: var(--accent); text-shadow: 0 0 6px rgba(109,240,255,0.6); }

  #handPreview { position: fixed; right: 14px; bottom: 14px; z-index: 5; padding: 6px; display: none; }
  #handPreview.show { display: block; }
  #handPreview canvas { display: block; width: 220px; height: 165px; background: #05060d; }

  #hint {
    position: fixed; bottom: 14px; left: 14px; z-index: 5; font-size: 10.5px; color: #6f97a0;
    padding: 6px 12px; letter-spacing: 0.3px;
    background: var(--hud-bg); border: 1px solid var(--accent-dim);
    clip-path: polygon(0 8px, 8px 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    opacity: 0.4; transition: opacity .4s ease;
  }
  #hint:hover, #hint.idle:hover { opacity: 1; }
  #hint.idle:not(:hover) { opacity: 0.12; }

  #panel { position: fixed; top: 0; right: 0; width: 380px; max-width: 90vw; height: 100vh;
    background: linear-gradient(180deg, rgba(6,11,18,0.92), rgba(5,9,15,0.97));
    border-left: 1px solid var(--accent-dim); box-shadow: -12px 0 32px rgba(0,0,0,0.5), inset 0 0 40px rgba(109,240,255,0.02);
    transform: translateX(100%); transition: transform 0.2s ease; z-index: 10; overflow-y: auto;
    padding: 20px 18px; box-sizing: border-box; }
  #panel.open { transform: translateX(0); }
  #panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent); opacity: 0.7; }
  #panel h2 { font-size: 14px; margin: 0 0 4px; word-break: break-all; color: var(--accent); letter-spacing: 0.5px; }
  #panel .meta { font-size: 11px; color: #6f97a0; margin-bottom: 14px; letter-spacing: 0.3px; }
  #panel .close { position: absolute; top: 14px; right: 16px; cursor: pointer; color: #6f97a0; font-size: 16px;
    background: none; border: 1px solid var(--accent-dim); width: 26px; height: 26px; line-height: 1; }
  #panel .close:hover { color: var(--accent); border-color: var(--accent); }
  #panel pre { background: rgba(109,240,255,0.04); border: 1px solid var(--accent-dim); padding: 10px;
    font-size: 11px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  #panel h3 { font-size: 10.5px; color: var(--accent); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 1.5px;
    opacity: 0.8; }
  .diff-add { color: #7ee787; }
  .diff-del { color: #ff7b72; }
  .diff-hunk { color: #6e7cff; }

  /* ---- 手机横屏：竖向空间紧张，收紧 HUD ---- */
  @media (max-height: 480px) {
    #hud { max-width: 220px; gap: 6px; top: 8px; left: 8px; }
    .hud-panel { padding: 6px 10px 8px; }
    .title { font-size: 10px; margin-bottom: 4px; }
    #legend { max-height: 64px; }
    #stats { margin-top: 4px; }
    #hint { font-size: 9px; padding: 4px 8px; bottom: 8px; left: 8px; max-width: 60vw; }
    #panel { padding: 14px; }
    #handPreview { right: 8px; bottom: 8px; }
    #handPreview canvas { width: 140px; height: 105px; }
  }
</style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div id="overlay"></div>

  <div id="mobileGate">
    <div class="gate-card">
      <p class="gate-title">进入沉浸模式</p>
      <p class="gate-sub">建议横屏 + 全屏观看，画面和触控体验最佳</p>
      <button id="gateEnter">进入全屏</button>
      <button id="gateSkip">跳过</button>
    </div>
  </div>

  <div id="hud">
    <div class="hud-panel">
      <p class="title">Starmap</p>
      <p class="sub" id="rootLabel">扫描中…</p>
      <input id="search" type="text" placeholder="搜索文件名…" />
      <div id="stats"></div>
      <button id="soundToggle">🔈 音乐: 关</button>
      <button id="handToggle">🖐️ 手势: 关</button>
    </div>
    <div class="hud-panel">
      <p class="title" style="font-size:10px;">图例 / 扩展名</p>
      <div id="legend"></div>
    </div>
  </div>

  <div id="hint">滚轮缩放 · 拖拽平移 · Shift+拖拽=旋转 · 拖动粒子固定 · 点击查看详情/diff · 点底部罗盘归零旋转 · 网格弯曲=引力阱 · 抖动明显=熵高</div>

  <div id="handPreview" class="hud-panel">
    <canvas id="handCanvas" width="220" height="165"></canvas>
  </div>

  <div id="panel">
    <button class="close" id="closePanel">✕</button>
    <h2 id="panelTitle"></h2>
    <div class="meta" id="panelMeta"></div>
    <div id="panelBody"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="audio.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="hands.js"></script>
  <script src="app.js"></script>
</body>
</html>
